<!DOCTYPE html>
<html>
<head>
    <title>Internal and External JavaScript</title>
    <!-- External JS -->
    <script src="script.js"></script>
</head>
<body>
    <h2>Internal and External JavaScript Example</h2>
    
    <!-- Internal JS -->
    <script>
        function internalMsg() {
            alert("Hello from Internal JavaScript!");
        }
    </script>

    <button onclick="internalMsg()">Run Internal JS</button>
    <button onclick="externalMsg()">Run External JS</button>
</body>
</html>
