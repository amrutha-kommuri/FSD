<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output</title>
</head>
<body>
    <h2>Output Methods in JavaScript</h2>
    <p id="demo"></p>

    <script>
        // 1. Using alert()
        alert("This is an alert box");

        // 2. Using console.log()
        console.log("Message shown in the browser console");

        // 3. Using document.write()
        document.write("This is written using document.write() <br>");

        // 4. Using innerHTML
        document.getElementById("demo").innerHTML = "This is set using innerHTML";
    </script>
</body>
</html>
